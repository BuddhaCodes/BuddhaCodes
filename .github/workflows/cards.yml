name: Profile cards

# Redraws assets/stats.svg, assets/languages.svg and assets/goban.svg from the GitHub API once a day
# (and on demand from the Actions tab). Uses only this repository's own token; no external services.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/cards.py", ".github/workflows/cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw the cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXCLUDE_LANGUAGES: ""   # e.g. "HTML,CSS" to leave website code out of the language card
        run: python3 scripts/cards.py ${{ github.repository_owner }}

      - name: Commit if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg assets/goban.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile cards" && git push
